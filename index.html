<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DaraScribe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--mute:#677284;--line:#dde2e9;--flag:#ffe9a8;--flag-b:#e0b73c;--old:#fde0dd;--old-t:#a23b32;--new:#d5f0de;--new-t:#1d6b3c;--accent:#2f5bd8;--ok:#2e9a5b;--warn:#d89a1e;--bad:#cf4a3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1a2029;--ink:#e8ecf2;--mute:#97a2b3;--line:#2c3541;--flag:#4a3d12;--flag-b:#b8932b;--old:#4a2522;--old-t:#f1a49c;--new:#16402a;--new-t:#8fdcae;--accent:#7b9bff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
[hidden]{display:none!important}
.app{max-width:1020px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
textarea,#doc{width:100%;min-height:340px;padding:16px 18px;font:17px/1.75 "Source Serif 4",Georgia,serif;color:var(--ink);background:transparent;border:0;resize:vertical;white-space:pre-wrap;word-wrap:break-word;display:block}
textarea{outline:none}
#wrap{position:relative}
mark.f{background:var(--flag);color:inherit;border-bottom:2px solid var(--flag-b);border-radius:3px;padding:0 1px;cursor:pointer}
mark.f.ignored{background:transparent;border-bottom:2px dotted var(--mute);opacity:.8}
.pair{cursor:pointer}
.pair del{background:var(--old);color:var(--old-t);border-radius:3px;padding:0 2px}
.pair ins{background:var(--new);color:var(--new-t);text-decoration:none;border-radius:3px;padding:0 2px;margin-left:4px}
#card{position:absolute;z-index:5;width:min(350px,calc(100% - 8px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px;font-size:14px;display:none}
#card h3{margin:0 0 8px;font-size:14px;font-weight:600}
#card .lbl{font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
#card p{margin:0}
.sg{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;font-family:"Source Serif 4",Georgia,serif;font-size:15px}
.sg small{display:block;font:12px "Be Vietnam Pro",sans-serif;color:var(--mute)}
.hint{margin-top:8px;color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#card textarea{min-height:64px;padding:8px 10px;font-size:15px;line-height:1.5;border:1px solid var(--line);border-radius:7px;resize:vertical;margin:0;background:var(--bg)}
.side{padding:16px}
.side h2{font-size:14px;margin:0 0 4px;font-weight:600}
.big{font-size:40px;font-weight:600;line-height:1.1}
.big span{font-size:16px;color:var(--mute);font-weight:400}
.gauge{position:relative;height:10px;background:var(--line);border-radius:99px;margin:12px 0 4px;overflow:visible}
.gauge i{display:block;height:100%;border-radius:99px;transition:width .35s,background .35s}
.gauge b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:20%}
.tick{font-size:12px;color:var(--mute);margin-left:calc(20% - 40px)}
.mini{margin-top:14px}
.mini div{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.mini .t{height:5px;background:var(--line);border-radius:9px;margin-top:3px}
.mini .t i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .35s}
.note{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.left{padding:10px 14px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>DaraScribe</h1>
  <div class="sub">Nghiên cứu và phát triển bởi DaraNox</div>
</header>
<div class="grid">
  <section class="panel">
    <div class="bar" id="bar"></div>
    <div id="wrap">
      <textarea id="ta" aria-label="Văn bản" spellcheck="false"></textarea>
      <div id="doc" hidden></div>
      <div id="card" role="dialog"></div>
    </div>
    <div class="left" id="left" hidden></div>
  </section>
  <aside class="panel side">
    <h2>Mức giống văn AI (tham khảo)</h2>
    <div class="big" id="score">0<span>%</span></div>
    <div class="gauge"><i id="g"></i><b></b></div>
    <div class="tick">mục tiêu 20%</div>
    <div class="mini" id="mini"></div>
    <div class="note">Đây là số liệu tham khảo từ bộ chấm nội bộ, dựa trên nhịp câu, từ nối, cấu trúc đoạn, giọng văn, chi tiết thực tế và độ chuẩn mực của văn bản. Các trình kiểm tra AI khác có thể cho con số khác.</div>
  </aside>
</div>
</div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var cap=function(w){return w.charAt(0).toUpperCase()+w.slice(1)};

/* ---------- Bộ luật (mỗi ngôn ngữ một nhóm) ---------- */
function S(ws,title,reason,alts){return{start:1,title:title,reason:reason,alts:alts,re:new RegExp('(?<=^|[.!?…]\\s+)(?:'+ws+')[,;]?\\s*(\\p{L}+)','gimu')}}
function P(re,title,reason,alts,hint){return{title:title,reason:reason,alts:alts||[],hint:hint,re:new RegExp(re,'giu')}}
var RULES=[
 S('hơn nữa','Từ nối “Hơn nữa”','“Hơn nữa” nghe như văn nghị luận và là từ nối AI hay dùng để chuyển ý. Khi viết thường ngày, ý sau thường tự nối với ý trước mà không cần từ chuyển.',['Còn','Với lại','']),
 S('bên cạnh đó|ngoài ra','Từ nối “Bên cạnh đó”','Từ nối này được dùng dày đặc trong văn do AI viết, nên khi xuất hiện đều đặn đầu câu, đoạn văn có cảm giác lắp ghép.',['Thêm nữa','Còn','']),
 S('tóm lại|nhìn chung|có thể thấy rằng|có thể thấy','Mở kết luận theo khuôn','Câu kết bắt đầu bằng “Tóm lại/Nhìn chung” là mẫu lặp ở cuối gần như mọi đoạn AI. Người viết thật thường kết bằng một nhận định cụ thể của mình.',['Nói gọn lại','Rốt cuộc','']),
 P('đóng vai trò (?:quan trọng|then chốt|thiết yếu|quyết định)','“Đóng vai trò quan trọng”','Cụm này trừu tượng: nó khẳng định tầm quan trọng nhưng không cho biết quan trọng ở điểm nào, nên người đọc không học được gì thêm.',['rất quan trọng','có ảnh hưởng lớn','không thể thiếu'],'Thử nói rõ nó quan trọng ở đâu, bằng một con số hoặc một tình huống.'),
 P('trong bối cảnh (?:hiện nay|ngày nay|hiện đại|toàn cầu hóa)','Mở bài sáo “Trong bối cảnh…”','Cụm mở đầu này ghép được vào bất kỳ đề tài nào, vì vậy nó không mang thông tin riêng và khiến văn bản nghe chung chung.',['Bây giờ','Hiện nay'],'Mở bằng một chi tiết cụ thể của bạn sẽ tự nhiên hơn.'),
 P('(?:mang lại|đem lại|mang đến) nhiều (?:lợi ích|giá trị)','“Mang lại nhiều lợi ích”','Câu khẳng định có lợi ích nhưng không nói lợi ích gì, kiểu viết an toàn mà AI rất hay chọn.',['giúp ích khá nhiều'],'Thay bằng một lợi ích cụ thể, ví dụ “giúp học sinh ôn bài nhanh hơn”.'),
 P('một cách (\\p{L}+)','Cấu trúc “một cách + tính từ”','Cấu trúc này giống văn dịch từ tiếng Anh (“in an effective way”). Tiếng Việt thường đặt tính từ hoặc trạng từ ngay sau động từ.',function(m){return[m[1]]}),
 P('không chỉ [^.!?\\n]{3,60}? mà còn','Cấu trúc “không chỉ… mà còn…”','Hai vế cân đối này được AI dùng rất dày. Khi lặp lại, văn bản nghe như làm theo công thức.',[],'Thử tách thành hai câu ngắn: ý chính nói trước, ý phụ nói sau.'),
 S('furthermore|moreover|additionally|in addition','Từ nối cứng (Furthermore…)','Những từ nối kiểu “Furthermore/Moreover” rất hiếm trong văn nói và văn thường ngày, nhưng AI dùng liên tục để nối câu.',['Also,','And','']),
 S('in conclusion|in summary|to sum up|overall','Mở kết luận theo khuôn','Câu kết “In conclusion/Overall” là mẫu lặp ở cuối đoạn AI. Kết bằng một nhận định riêng của bạn sẽ có dấu ấn hơn.',['So,','Bottom line,','']),
 P('plays? an? (?:crucial|vital|pivotal|key) role in','“Plays a crucial role in”','Cụm này khẳng định tầm quan trọng mà không nói cụ thể vì sao, và xuất hiện cực kỳ nhiều trong văn do AI viết.',['matters for','is key to'],'Hãy nêu rõ nó quan trọng ở điểm nào.'),
 P('delv(?:e|es|ed|ing) (?:in)?to','“Delve into”','“Delve” là từ rất hiếm khi người bản ngữ dùng trong văn thường, nhưng lại phổ biến trong văn AI.',['dig into','look at']),
 P('in today[’\']s (?:fast-paced|digital|modern) (?:world|age|era)','Mở bài sáo “In today’s world”','Cụm mở đầu này ghép được vào mọi đề tài nên không mang thông tin riêng.',[],'Mở bằng một chi tiết hoặc con số cụ thể.'),
 P('a testament to','“A testament to”','Cách nói hoa mỹ này hay được AI dùng để nâng tầm một ý, trong khi động từ đơn giản thường đủ.',['proof of','a sign of']),
 P('\\bleverag(?:e|es|ed|ing)\\b','“Leverage”','“Leverage” nghe như văn kinh doanh. Trong văn thường, “use” tự nhiên hơn.',['use'])
];
var OPENER={title:'Ba câu liền mở đầu giống nhau',reason:'Khi ba câu liên tiếp bắt đầu bằng cùng một từ, nhịp văn bị đều và máy móc. Người viết thật thường đổi cách vào câu.',alts:[],hint:'Thử đổi cách mở đầu câu này, hoặc gộp hai câu lại.'};

function suggs(r,m){
 if(r.start)return r.alts.map(function(a){return a?{tag:'',text:a+' '+m[1]}:{tag:'Bỏ từ nối',text:cap(m[1])}});
 var a=typeof r.alts==='function'?r.alts(m):r.alts;return a.map(function(x){return{tag:'',text:x}});
}
function phr(t){
 var out=[],i,x;
 RULES.forEach(function(r){for(var m of t.matchAll(r.re))out.push({s:m.index,e:m.index+m[0].length,r:r,m:m})});
 var se=[];for(var m of t.matchAll(/[^.!?\n]+[.!?]*/g)){var lead=m[0].length-m[0].trimStart().length,w=(m[0].trim().match(/^\p{L}+/u)||[''])[0];if(w)se.push({i:m.index+lead,w:w.toLowerCase(),raw:w})}
 for(i=2;i<se.length;i++)if(se[i].w.length>1&&se[i].w===se[i-1].w&&se[i].w===se[i-2].w)out.push({s:se[i].i,e:se[i].i+se[i].raw.length,r:OPENER,m:[se[i].raw]});
 out.sort(function(a,b){return a.s-b.s||b.e-a.e});
 var res=[],end=-1;out.forEach(function(x){if(x.s>=end){res.push(x);end=x.e}});return res;
}
function sents(t){var r=[];for(var m of t.matchAll(/[^.!?\n]+[.!?]*/g)){var lead=m[0].length-m[0].trimStart().length,s=m[0].trim();if(s)r.push({s:m.index+lead,e:m.index+lead+s.length,t:s,w:s.split(/\s+/).length})}return r}
function splitS(t){
 var tail=t.match(/[.!?]*$/)[0],b=t.slice(0,t.length-tail.length),tot=b.split(/\s+/).length,best=null,bd=1e9;
 for(var m of b.matchAll(/[,;:]\s+/g)){var L=b.slice(0,m.index),k=L.split(/\s+/).length;
  if(k<6||tot-k<6||(L.match(/\(/g)||[]).length!==(L.match(/\)/g)||[]).length)continue;
  if(Math.abs(k-tot/2)<bd){bd=Math.abs(k-tot/2);best=[L,b.slice(m.index+m[0].length)]}}
 return best?best[0]+'. '+cap(best[1].replace(/^(?:thì|và|mà|nên)\s+/i,''))+(tail||'.'):null;
}
var R={
 long:{title:'Câu quá dài',reason:'Câu dài liên tục làm nhịp văn đều và nặng, người đọc khó lấy hơi. Người viết thật thường xen những câu ngắn để tạo điểm nhấn.',hint:'Tách ở chỗ ý đổi hướng, hoặc bỏ bớt vế phụ.'},
 uni:{title:'Nhịp câu đều, thiếu câu ngắn',reason:'Cả đoạn toàn câu dài vừa, không có câu ngắn nào, nên nhịp đều như máy. Một câu ngắn xen vào sẽ đổi nhịp và tạo điểm nhấn.',hint:'Thêm một câu rất ngắn (dưới 6 từ), tốt nhất là nhận xét của chính bạn.'},
 voice:{title:'Giọng văn trung lập',reason:'Cả đoạn chỉ trình bày thông tin, không có quan điểm hay cảm nhận của người viết. Văn do AI viết hay an toàn và trung tính như vậy, còn người viết thật hay để lộ nhận định riêng.',hint:'Thêm một câu thể hiện bạn nghĩ gì hoặc thấy gì về vấn đề này.'},
 exp:{title:'Thiếu chi tiết thật',reason:'Câu này nói chung chung, chưa có tên, con số hay tình huống cụ thể. Chi tiết rút từ trải nghiệm thật là thứ khó giả nhất của văn người viết.',hint:'Điền một ví dụ bạn đã gặp hoặc biết rõ (tên, con số, thời điểm) vào chỗ [ ].'}
};
function deep(t,taken){
 var S=sents(t),vi=/[ăâđêôơưàáảãạèéẻẽẹìíỉĩịòóỏõọùúủũụỳýỷỹỵ]/i.test(t),c=[];
 var PERS=/(?<![\p{L}])(?:tôi|mình|tớ|tao|em|anh|chị|nhé|nhỉ|ạ|à|ơi|haha|I|my|me|we|our)(?![\p{L}])|[!?]|…/iu;
 var CONC=/\d|(?<=[^.!?…\n\s]\s)\p{Lu}\p{L}+|(?<![\p{L}])(?:hôm qua|năm ngoái|tuần trước|hồi đó|lần đó|lần đầu|hồi nhỏ|sáng nay|tối qua|yesterday|last (?:year|week|month|night)|years ago)(?![\p{L}])/u;
 var P=S.map(function(x){return(t.slice(0,x.s).match(/\n/g)||[]).length});
 function add(x,r,sg,pr){c.push({s:x.s,e:x.e,r:r,m:[x.t],sg:sg,pr:pr})}
 S.forEach(function(x){if(x.w>=24){var y=splitS(x.t);add(x,R.long,y?[{tag:'Tách thành hai câu',text:y}]:[],0)}});
 var G={};S.forEach(function(x,i){(G[P[i]]=G[P[i]]||[]).push(i)});
 Object.keys(G).forEach(function(k){
  var g=G[k];if(g.length<2)return;
  var free=g.filter(function(i){return S[i].w<24}),last=S[free.length?free[free.length-1]:g[g.length-1]];
  if((g.map(function(i){return S[i].t}).join(' ').match(new RegExp(PERS.source,'giu'))||[]).length/g.length<0.25)add(last,R.voice,(vi?[' Mình thấy đây mới là điểm khó nhất.',' Tôi nghĩ vấn đề nằm ở chỗ này.']:[' I think this is the hard part.',' To me, that is what matters most.']).map(function(a){return{tag:'Thêm góc nhìn của bạn',text:last.t+a}}),2);
  var no=g.filter(function(i){return!CONC.test(S[i].t)});
  if(no.length&&(g.length-no.length)/g.length<0.5){var np=no.filter(function(i){return S[i].w<24});var bi=(np.length?np:no).sort(function(a,b){return S[b].w-S[a].w})[0];add(S[bi],R.exp,[{tag:'Thêm ví dụ thật của bạn',text:S[bi].t+(vi?' Ví dụ: [điền một tình huống thật, có tên, con số hoặc thời điểm].':' For example: [add a real case with a name, number or date].')}],1)}
  if(g.length>=3&&!g.some(function(i){return S[i].w<=6})&&free.length){var b=S[free[0]];add(b,R.uni,(vi?['Khó thật.','Không dễ như vậy.']:['Not easy.','That matters.']).map(function(a2){return{tag:'Thêm một câu ngắn',text:b.t+' '+a2}}),3)}
 });
 c.sort(function(a,b){return a.pr-b.pr||a.s-b.s});
 var res=[];c.forEach(function(x){if(!taken.concat(res).some(function(y){return x.s<y.e&&y.s<x.e}))res.push(x)});return res;
}
function scan(t){var p=phr(t);return p.concat(deep(t,p)).sort(function(a,b){return a.s-b.s})}

/* ---------- Bộ chấm nội bộ (số liệu tham khảo) ---------- */
function detect(t){
 var se=(t.match(/[^.!?\n]+[.!?]*/g)||[]).filter(function(s){return s.trim()}),n=se.length;
 if(!t.trim()||n===0)return{score:0,top:''};
 var cl=function(x){return Math.max(0,Math.min(1,x))};
 var cv=function(a){var m=a.reduce(function(p,c){return p+c},0)/a.length;return m?Math.sqrt(a.reduce(function(p,c){return p+(c-m)*(c-m)},0)/a.length)/m:0};
 var W=se.map(function(s){return s.trim().split(/\s+/).length}),i;
 /* 1. Nhịp câu thiếu đột biến */
 var f1=n<3?0.5:cl(1-cv(W)/0.6);
 /* 2. Lạm dụng từ nối, cụm rập khuôn, lặp mở câu */
 var f2=cl(phr(t).length/n/0.9);
 /* 3. Cấu trúc quá đối xứng */
 var paras=t.split(/\n+/).filter(function(s){return s.trim()}),f3;
 if(paras.length>=2)f3=cl(1-cv(paras.map(function(p){return p.trim().split(/\s+/).length}))/0.5);
 else{var eq=0;for(i=1;i<n;i++)if(Math.abs(W[i]-W[i-1])<=0.2*Math.max(W[i],W[i-1]))eq++;f3=n<2?0.5:eq/(n-1)}
 /* 4. Giọng trung lập, thiếu sắc thái cá nhân */
 var pers=(t.match(/(?<![\p{L}])(?:tôi|mình|tớ|tao|em|anh|chị|nhé|nhỉ|ạ|à|ơi|haha|I|my|me|we|our)(?![\p{L}])|[!?]|…|\.\.\./giu)||[]).length;
 var f4=cl(1-pers/n/0.25);
 /* 5. Thiếu chi tiết từ trải nghiệm thực */
 var conc=(t.match(/\d+/g)||[]).length+(t.match(/(?<=[^.!?…\n\s]\s)\p{Lu}\p{L}+/gu)||[]).length+(t.match(/(?<![\p{L}])(?:hôm qua|hôm nay|năm ngoái|tuần trước|hồi đó|lần đó|lần đầu|hồi nhỏ|sáng nay|tối qua|yesterday|last (?:year|week|month|night)|when I|years ago)(?![\p{L}])/giu)||[]).length;
 var f5=cl(1-conc/n/0.5);
 /* 6. Quá hoàn hảo, chuẩn mực */
 var imp=W.filter(function(w){return w<=4}).length+se.filter(function(s){return /^\s*(?:mà|nhưng|và|còn|but|and|so)(?![\p{L}])/iu.test(s)}).length+(t.match(/\.\.\.|…|—|\(|\s-\s|\p{L}['’]\p{L}/gu)||[]).length;
 var f6=cl(1-imp/n/0.25);
 var F=[[0.2,f1,'Thử xen vài câu rất ngắn vào giữa các câu dài.'],[0.25,f2,'Còn nhiều từ nối và cụm rập khuôn, hãy xem các chỗ được tô.'],[0.15,f3,'Các câu có độ dài khá giống nhau, thử đổi nhịp một chút.'],[0.15,f4,'Thử thêm góc nhìn của riêng bạn: một nhận xét, một câu hỏi, “tôi nghĩ”.'],[0.15,f5,'Thử thêm một chi tiết thật: tên, con số, thời điểm hoặc một lần bạn đã gặp.'],[0.1,f6,'Thử viết gần lời nói hơn: một câu lửng hoặc một ý thêm trong ngoặc.']];
 var sc=0,best=0,top='';
 F.forEach(function(x){var v=x[0]*x[1];sc+=v;if(v>best){best=v;top=x[2]}});
 return{score:Math.round(sc*100),top:top};
}

/* ---------- Trạng thái ---------- */
var VI='Trong bối cảnh hiện nay, công nghệ đóng vai trò quan trọng trong cuộc sống của chúng ta. Hơn nữa, trí tuệ nhân tạo mang lại nhiều lợi ích cho giáo dục. Bên cạnh đó, nó giúp học sinh học tập một cách hiệu quả. Không chỉ tiết kiệm thời gian mà còn nâng cao chất lượng bài học. Tóm lại, việc ứng dụng công nghệ là xu hướng tất yếu.';
var EN='In today’s fast-paced world, technology plays a crucial role in education. Furthermore, AI tools delve into data to help students learn. Moreover, they leverage feedback to personalize every lesson. In conclusion, technology is a testament to human progress.';
var parts=[],mode='edit',open=null;
var ta=$('#ta'),doc=$('#doc'),card=$('#card'),bar=$('#bar');
ta.value=VI;

function build(t){
 var ms=scan(t),pos=0,p=[];
 ms.forEach(function(x){if(x.s>pos)p.push({k:'t',s:t.slice(pos,x.s)});p.push({k:'f',s:t.slice(x.s,x.e),r:x.r,sg:x.sg||suggs(x.r,x.m),st:'open'});pos=x.e});
 if(pos<t.length)p.push({k:'t',s:t.slice(pos)});return p;
}
function eff(){return parts.map(function(p){return p.k==='p'?p.nw:(p.s||'')}).join('')}
function pj(p){return p.nw&&p.nw.indexOf(p.old)===0?p.nw:p.old+(p.nw?' '+p.nw:'')}
function plain(){return parts.map(function(p){return p.k==='p'?pj(p):p.s}).join('')}
function lang(t){return /[ăâđêôơưàáảãạèéẻẽẹìíỉĩịòóỏõọùúủũụỳýỷỹỵ]/i.test(t)?'Tiếng Việt':(/[a-z]{3}/i.test(t)?'English':'Chưa rõ ngôn ngữ')}

/* ---------- Hiển thị ---------- */
function renderBar(){
 var h='<span class="chip">'+lang(mode==='edit'?ta.value:plain())+'</span>';
 if(mode==='edit')h+='<button data-a="vi">Mẫu tiếng Việt</button><button data-a="en">English sample</button><span class="sp"></span><button class="pri" data-a="check">Kiểm tra văn phong</button>';
 else h+='<span class="sp"></span><button data-a="copy">Chép văn bản</button><button data-a="back">Sửa tiếp</button>';
 bar.innerHTML=h;
}
function renderScore(){
 var t=mode==='edit'?ta.value:eff(),d=detect(t),g=$('#g');
 $('#score').innerHTML=d.score+'<span>%</span>';
 g.style.width=Math.min(100,d.score)+'%';g.style.background=d.score<20?'var(--ok)':d.score<50?'var(--warn)':'var(--bad)';
 $('#mini').innerHTML='<p style="margin:0;font-size:13px">'+(!t.trim()?'':d.score<20?'Đã dưới mục tiêu 20% theo số liệu tham khảo.':d.top)+'</p>';
}
function renderDoc(){
 doc.innerHTML=parts.map(function(p,i){
  if(p.k==='t')return esc(p.s);
  if(p.k==='f')return'<mark class="f '+p.st+'" data-i="'+i+'">'+esc(p.s)+'</mark>';
  var ap=p.nw&&p.nw.indexOf(p.old)===0;return'<span class="pair" data-i="'+i+'">'+(ap?esc(p.old)+'<ins>'+esc(p.nw.slice(p.old.length).trim())+'</ins>':'<del>'+esc(p.old)+'</del><ins>'+(p.nw?esc(p.nw):'(bỏ cụm này)')+'</ins>')+'</span>';
 }).join('');
 var n=parts.filter(function(p){return p.k==='f'&&p.st==='open'||p.k==='p'}).length,l=$('#left');
 l.hidden=false;l.textContent=n?('Còn '+n+' chỗ cần xem. Bấm vào chỗ được tô để xem lý do và gợi ý.'):'Đã xem hết vòng này. Bấm “Sửa tiếp” rồi “Kiểm tra” lại để quét vòng mới, vì khi sửa xong có thể lộ thêm chỗ khác.';
 showCard();
}
function showCard(){
 if(open===null||!parts[open]){card.style.display='none';return}
 var p=parts[open],h='';
 if(p.k==='f'){
  h='<h3>'+p.r.title+'</h3><div class="lbl">Vì sao chưa tự nhiên</div><p>'+p.r.reason+'</p>';
  if(p.sg.length){h+='<div class="lbl">Gợi ý: chọn để thêm vào văn bản</div>'+p.sg.map(function(s,j){return'<button class="sg" data-a="apply" data-j="'+j+'">'+(s.tag?'<small>'+s.tag+'</small>':'')+esc(s.text)+'</button>'}).join('')}
  if(p.r.hint)h+='<div class="hint">'+p.r.hint+'</div>';
  h+='<div class="lbl">Hoặc tự viết lại theo ý bạn</div><textarea id="own" rows="2" spellcheck="false">'+esc(p.s)+'</textarea><div class="row"><button class="pri" data-a="own">Dùng bản của tôi</button></div>';
  h+='<div class="row"><button data-a="ignore">'+(p.st==='ignored'?'Đã giữ nguyên, bấm để xem lại':'Giữ nguyên chỗ này')+'</button><button data-a="close">Đóng</button></div>';
 }else{
  h='<h3>Bạn muốn xử lý câu cũ thế nào?</h3><p>Gợi ý mới đã được thêm ngay sau đoạn cũ. Việc xoá hay giữ đoạn cũ là do bạn quyết định.</p><div class="lbl">Chỉnh lại bản mới theo ý bạn</div><textarea id="own" rows="2" spellcheck="false">'+esc(p.nw)+'</textarea><div class="row"><button data-a="own">Cập nhật bản mới</button></div><div class="row"><button class="pri" data-a="delold">Xoá câu cũ</button><button data-a="both">Giữ cả hai</button><button data-a="undo">Hoàn tác</button></div>';
 }
 card.innerHTML=h;card.style.display='block';
 var el=doc.querySelector('[data-i="'+open+'"]'),w=$('#wrap').getBoundingClientRect(),r=el.getBoundingClientRect();
 card.style.top=(r.bottom-w.top+8)+'px';
 card.style.left=Math.max(0,Math.min(r.left-w.left,w.width-card.offsetWidth-4))+'px';
}
function setMode(m){mode=m;ta.hidden=m!=='edit';doc.hidden=m==='edit';$('#left').hidden=m==='edit';open=null;card.style.display='none';renderBar();renderScore()}

/* ---------- Hành động ---------- */
bar.addEventListener('click',function(e){
 var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
 if(a==='vi'){ta.value=VI}
 else if(a==='en'){ta.value=EN}
 else if(a==='check'){parts=build(ta.value);setMode('review');renderDoc();return}
 else if(a==='back'){ta.value=plain();setMode('edit');return}
 else if(a==='copy'){try{navigator.clipboard.writeText(plain()).then(function(){e.target.textContent='Đã chép'},function(){e.target.textContent='Không chép được'})}catch(x){e.target.textContent='Không chép được'}return}
 renderBar();renderScore();
});
ta.addEventListener('input',function(){renderBar();renderScore()});
$('#wrap').addEventListener('click',function(e){
 var a=e.target.getAttribute&&e.target.getAttribute('data-a'),j=e.target.closest('[data-j]');
 if(j)a='apply';
 var i=open,p=i!==null?parts[i]:null;
 if(a==='apply'&&p){var s=p.sg[+j.getAttribute('data-j')];parts[i]={k:'p',old:p.s,nw:s.text,r:p.r,sg:p.sg}}
 else if(a==='own'&&p){var v=$('#own').value;if(p.k==='f')parts[i]={k:'p',old:p.s,nw:v,r:p.r,sg:p.sg};else p.nw=v}
 else if(a==='ignore'&&p){p.st=p.st==='ignored'?'open':'ignored';if(p.st==='ignored')open=null}
 else if(a==='close'){open=null}
 else if(a==='delold'&&p){parts[i]={k:'t',s:p.nw}; open=null}
 else if(a==='both'&&p){parts[i]={k:'t',s:pj(p)}; open=null}
 else if(a==='undo'&&p){parts[i]={k:'f',s:p.old,r:p.r,sg:p.sg,st:'open'}}
 else{
  var t=e.target.closest('[data-i]');
  if(t&&mode==='review'){open=+t.getAttribute('data-i')}
  else if(!e.target.closest('#card')){open=null}
  else return;
 }
 renderDoc();renderScore();
});
window.addEventListener('resize',function(){if(mode==='review')showCard()});

setMode('edit');
})();
</script>
</body>
</html>
